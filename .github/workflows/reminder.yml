name: Roster deadline reminder

# Posts to Discord about an hour before your first player tips off each day, listing the moves to make.
# It only reads the published plan (plan.json), so it makes no ESPN requests and takes a few seconds.
# Does nothing unless the DISCORD_WEBHOOK_URL secret is set.

on:
  schedule:
    # Hourly from 15:45 to 02:45 UTC, which covers every NBA tip-off from weekend matinees to late West Coast games.
    - cron: "45 15-23,0-2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m planner.remind
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
