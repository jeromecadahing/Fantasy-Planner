name: Daily matchup plan

on:
  schedule:
    # Times are UTC. The UK is on UTC in winter (UTC+1 in summer); US Eastern is UTC-5 in winter (UTC-4 in summer).
    # Minute 17 avoids GitHub's busy top-of-the-hour queue.
    #
    # Main run: after every game from the night before is final, including late West Coast games and overtime.
    # 08:17 UTC is about 8:15 am UK in winter (9:15 am in summer) and 3:15 am Eastern.
    - cron: "17 8 * * *"
    # Backup, in case GitHub starts the main run late or ESPN is slow to post the final box scores.
    - cron: "17 10 * * *"
    # Pre-lock refresh for the day's injury reports, about 2 hours before the usual 7 pm Eastern tip-off
    # (about 9:45 pm UK). Delete this line if you only want the morning plan.
    - cron: "47 21 * * *"
  workflow_dispatch:        # lets you press "Run workflow" any time
    inputs:
      what_if:
        description: "Optional scenario, e.g. add: Jalen Brunson; drop: Grant Sato"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: matchup-plan
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build the plan
        run: python -m planner.main --out site
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          YEAR: ${{ vars.YEAR }}
          ACTIVE_SLOTS: ${{ vars.ACTIVE_SLOTS }}
          ROSTER_SIZE: ${{ vars.ROSTER_SIZE }}
          MAX_ADDS: ${{ vars.MAX_ADDS }}
          ADD_DELAY_DAYS: ${{ vars.ADD_DELAY_DAYS }}
          KEEP_PLAYERS: ${{ vars.KEEP_PLAYERS }}
          MATCHUP_END: ${{ vars.MATCHUP_END }}
          RESERVE_ADDS: ${{ vars.RESERVE_ADDS }}
          WHAT_IF: ${{ inputs.what_if || vars.WHAT_IF }}
          WATCH_PLAYERS: ${{ vars.WATCH_PLAYERS || 'Jimmy Butler' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
